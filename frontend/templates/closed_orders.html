<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پرونده‌های مختومه</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
    <style>
      .closed-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .closed-search {
        min-width: 280px;
        max-width: 440px;
      }
      .closed-card {
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        background: #fff;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .closed-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
      }
      .closed-card .card-header {
        background: #f8fafc;
        border-bottom: 1px solid #eef2f7;
      }
      .closed-meta {
        color: #64748b;
        font-size: 0.88rem;
      }
      .closed-empty {
        border: 1px dashed #cbd5e1;
        border-radius: 14px;
        background: #f8fafc;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-primary shadow">
      <div class="container-fluid">
        <span class="navbar-brand"
          ><i class="fas fa-folder-closed"></i> پرونده‌های بسته شده</span
        >
      </div>
    </nav>
    <main class="container-fluid py-4">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <div class="closed-toolbar mb-4">
            <div>
              <h2 class="mb-1">بایگانی پرونده‌های بسته شده</h2>
              <p class="text-muted mb-0">
                پرونده‌های تحویل‌شده و مختومه بدون تعمیر در این بخش نگهداری
                می‌شوند.
              </p>
            </div>
            <div class="d-flex gap-2">
              <input
                id="closedSearch"
                class="form-control closed-search"
                placeholder="جستجوی کد، مشتری یا دستگاه"
              />
              <button
                id="refreshClosed"
                class="btn btn-outline-primary"
                title="بروزرسانی"
                aria-label="بروزرسانی"
              >
                <i class="fas fa-sync"></i>
              </button>
            </div>
          </div>
          <div id="closedSummary" class="text-muted small mb-3"></div>
          <div id="closedOrders" class="row g-3">
            <div class="col-12 text-center text-muted py-5">
              <i class="fas fa-spinner fa-spin fa-2x"></i>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="/static/js/app.js?v=20260817-1"></script>
    <script src="/static/js/pages/closed_orders.js?v=20260818-1"></script>
    <script src="/static/js/sidebar.js?v=20260818-2"></script>
  </body>
</html>
