<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#29216c" />
    <title>ورود به سامانه خدمات صحاب</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/static/css/login.css?v=20260819-2" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <img
        class="login-background"
        src="/static/img/login-bg.png"
        alt=""
        aria-hidden="true"
      />

      <form class="login-form" id="loginForm" novalidate>
        <div class="login-brand">
          <span class="login-brand-icon" aria-hidden="true">
            <i class="fas fa-screwdriver-wrench"></i>
          </span>
          <h1 class="login-title">ورود به سامانه</h1>
          <p class="login-subtitle">سامانه خدمات و مدیریت تعمیرات صحاب</p>
        </div>

        <div class="login-fields">
          <label class="login-field" for="username">
            <input
              class="login-input"
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="نام کاربری"
              required
            />
            <i class="fas fa-user" aria-hidden="true"></i>
          </label>

          <label class="login-field" for="password">
            <input
              class="login-input"
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="رمز عبور"
              required
            />
            <button
              class="login-password-toggle"
              id="passwordToggle"
              type="button"
              aria-label="نمایش رمز عبور"
              title="نمایش رمز عبور"
            >
              <i class="fas fa-eye" aria-hidden="true"></i>
            </button>
            <i class="fas fa-lock" aria-hidden="true"></i>
          </label>
        </div>

        <div class="login-options">
          <label class="login-remember" for="rememberMe">
            <input id="rememberMe" type="checkbox" checked />
            <span>مرا به خاطر بسپار</span>
          </label>
          <span class="login-help">برای دریافت دسترسی با مدیریت تماس بگیرید</span>
        </div>

        <button class="login-submit" type="submit">
          <i class="fas fa-arrow-right-to-bracket ms-1" aria-hidden="true"></i>
          ورود به سامانه
        </button>

        <div class="login-alert" id="alertBox" aria-live="polite"></div>
        <p class="login-footer">دسترسی اختصاصی کاربران سازمان</p>
      </form>
    </main>

    <script src="/static/js/login.js?v=20260819-2"></script>
  </body>
</html>
