<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سیستم</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #f8f9fa; font-family: 'Tahoma', sans-serif; height: 100vh; display: flex; align-items: center; }
        .login-card { border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); border: none; max-width: 400px; margin: auto; }
        .login-card .card-header { background: #0d6efd; color: white; border-radius: 20px 20px 0 0; padding: 25px; }
        .login-card .card-body { padding: 35px; }
        .btn-login { padding: 12px; border-radius: 25px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card login-card">
                    <div class="card-header text-center">
                        <i class="fas fa-fire-extinguisher fa-2x"></i>
                        <h4 class="mt-2">سیستم مدیریت تعمیرات</h4>
                    </div>
                    <div class="card-body">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">نام کاربری</label>
                                <input type="text" class="form-control" id="username" value="admin" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">رمز عبور</label>
                                <input type="password" class="form-control" id="password" value="admin123" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-login">
                                <i class="fas fa-sign-in-alt"></i> ورود
                            </button>
                        </form>
                        <div class="mt-3 text-center">
                            <small class="text-muted">کاربر پیش‌فرض: admin / admin123</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
    // اگر قبلاً وارد شده بود، به صفحه اصلی برود
    const token = localStorage.getItem('access_token');
    if (token) {
        window.location.href = '/';
    }

    $('#loginForm').on('submit', function(e) {
        e.preventDefault();
        
        const username = $('#username').val();
        const password = $('#password').val();
        
        const submitBtn = $(this).find('button[type="submit"]');
        submitBtn.html('<i class="fas fa-spinner fa-spin"></i> در حال ورود...').prop('disabled', true);
        
        const formData = new FormData();
        formData.append('username', username);
        formData.append('password', password);
        
        fetch('/auth/login', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => {
                    throw new Error(err.detail || 'خطا در ورود');
                });
            }
            return response.json();
        })
        .then(data => {
            localStorage.setItem('access_token', data.access_token);
            localStorage.setItem('user', JSON.stringify({
                username: data.username,
                full_name: data.full_name,
                role: data.role
            }));
            
            Swal.fire({
                icon: 'success',
                title: 'خوش آمدید!',
                text: `${data.full_name} عزیز، به سیستم خوش آمدید`,
                timer: 1500,
                showConfirmButton: false
            }).then(() => {
                window.location.href = '/';
            });
        })
        .catch(error => {
            Swal.fire({
                icon: 'error',
                title: 'خطا!',
                text: error.message
            });
        })
        .finally(() => {
            submitBtn.html('<i class="fas fa-sign-in-alt"></i> ورود').prop('disabled', false);
        });
    });
    </script>
</body>
</html>
