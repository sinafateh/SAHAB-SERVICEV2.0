<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزئیات پرونده</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=20260819-2">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .case-timeline { position:relative; padding-right:1.5rem; }
        .case-timeline:before { content:""; position:absolute; right:.45rem; top:0; bottom:0; width:2px; background:#bfd8f1; }
        .case-timeline-item { position:relative; padding:0 0 1rem 0; }
        .case-timeline-dot { position:absolute; right:-1.5rem; top:.25rem; width:12px; height:12px; border-radius:50%; background:#2d7bc8; border:3px solid #dcecff; }
        .case-timeline-content { background:rgba(247,251,255,.56); border:1px solid rgba(220,233,247,.9); border-radius:18px; padding:.85rem; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
        .case-tabs { overflow-x:auto; flex-wrap:nowrap; }
        .case-tabs .nav-link { white-space:nowrap; }
        .case-receipt { background:rgba(255,255,255,.3); }
        .case-receipt-header { display:flex; justify-content:space-between; gap:1rem; align-items:center; padding:1rem; border:1px solid rgba(220,233,247,.9); border-radius:20px; background:rgba(247,251,255,.56); margin-bottom:1rem; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
        .tracking-code { font-size:1.35rem; }
        .case-info-section { border:1px solid rgba(220,233,247,.9); border-radius:20px; padding:1rem; margin-bottom:1rem; background:rgba(255,255,255,.56); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
        .case-info-section h5 { color:#2269b3; border-bottom:2px solid #dcecff; padding-bottom:.6rem; margin-bottom:.75rem; }
        .case-detail-row { display:flex; justify-content:space-between; gap:1rem; border-bottom:1px dashed #e5e7eb; padding:.45rem 0; }
        .case-detail-row:last-child { border-bottom:0; }
        .case-detail-label { color:#6b7280; font-weight:600; min-width:170px; }
        .case-detail-value { text-align:left; white-space:pre-wrap; overflow-wrap:anywhere; }
        .case-note { background:rgba(247,251,255,.56); border:1px solid rgba(220,233,247,.9); border-radius:16px; padding:.85rem; white-space:pre-wrap; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
        @media (max-width: 600px) { .case-detail-row { display:block; } .case-detail-value { display:block; text-align:right; margin-top:.2rem; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-fire-extinguisher"></i>
                سیستم مدیریت تعمیرات
            </a>
            <div>
                <a href="/orders" class="btn btn-light btn-sm me-2">
                    <i class="fas fa-arrow-right"></i> بازگشت
                </a>
                <a href="/" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-home"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div id="order-detail">
            <div class="text-center text-muted py-5">
                <i class="fas fa-spinner fa-spin fa-3x"></i>
                <p class="mt-3">در حال بارگذاری...</p>
            </div>
        </div>
    </div>

    <!-- ✅ ترتیب مهم -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js?v=20260817-1"></script>
    <script>
        // ✅ دریافت orderId از URL - فقط یک بار تعریف شود
        var pathParts = window.location.pathname.split('/');
        var orderId = parseInt(pathParts[pathParts.length - 1]);
        
        // بررسی اینکه orderId عدد معتبری است
        if (isNaN(orderId) || orderId <= 0) {
            document.getElementById('order-detail').innerHTML = `
                <div class="alert alert-danger">
                    <h4><i class="fas fa-exclamation-triangle"></i> شناسه نامعتبر</h4>
                    <p>شناسه پرونده وارد شده معتبر نیست.</p>
                    <a href="/orders" class="btn btn-primary mt-2">
                        <i class="fas fa-arrow-right"></i> بازگشت به لیست
                    </a>
                </div>
            `;
        }
        
        console.log('📄 order_detail لود شد - ID:', orderId);
    </script>
    <script src="/static/js/pages/order_detail.js?v=20260818-1"></script>
    <script src="/static/js/sidebar.js?v=20260819-2"></script>
</body>
</html>
