<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لیست پرونده‌ها</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-fire-extinguisher"></i>
                سیستم مدیریت تعمیرات
            </a>
            <a href="/" class="btn btn-light btn-sm">بازگشت</a>
        </div>
    </nav>

    <div class="container py-4">
        <h2 class="mb-4"><i class="fas fa-list text-primary"></i> همه پرونده‌ها</h2>
        
        <div class="card shadow">
            <div class="card-header bg-white">
                <div class="row g-2">
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="searchInput" placeholder="جستجو...">
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="statusFilter">
                            <option value="">همه وضعیت‌ها</option>
                            <option value="ثبت شده">ثبت شده</option>
                            <option value="در انتظار بررسی فنی">در انتظار بررسی فنی</option>
                            <option value="در حال عیب‌یابی">در حال عیب‌یابی</option>
                            <option value="در انتظار تایید مشتری">منتظر تایید</option>
                            <option value="در حال تعمیر">در حال تعمیر</option>
                            <option value="در حال تست">در حال تست</option>
                            <option value="کنترل نهایی">کنترل نهایی</option>
                            <option value="آماده تحویل">آماده تحویل</option>
                            <option value="تحویل شده">تحویل شده</option>
                            <option value="مختومه بدون تعمیر">مختومه بدون تعمیر</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100" id="searchBtn">
                            <i class="fas fa-search"></i> جستجو
                        </button>
                    </div>
                    <div class="col-md-3">
                        <a href="/new-order" class="btn btn-success w-100">
                            <i class="fas fa-plus"></i> پرونده جدید
                        </a>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div id="orders-table" class="text-center text-muted">
                    <i class="fas fa-spinner fa-spin"></i> در حال بارگذاری...
                </div>
            </div>
        </div>
    </div>

    <!-- ✅ ترتیب مهم: اول jQuery، سپس app.js، سپس orders.js -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/pages/orders.js"></script>
    <script src="/static/js/sidebar.js"></script>
</body>
</html>
