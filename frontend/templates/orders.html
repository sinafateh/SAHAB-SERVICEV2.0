<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برد کانبان پرونده‌ها</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=20260822-3">
    <style>
        .kanban-toolbar { display:flex; justify-content:space-between; align-items:flex-end; gap:1.5rem; margin-bottom:1rem; }
        .kanban-actions { display:flex; align-items:center; gap:.65rem; flex:0 0 auto; }
        .kanban-search { width:clamp(260px, 30vw, 440px); height:46px; }
        .kanban-action-btn { min-height:46px; white-space:nowrap; }
        .kanban-refresh-btn { width:46px; height:46px; padding:0; }
        .kanban-top-scroll { overflow-x:auto; overflow-y:hidden; height:18px; margin:0 0 .65rem; border-radius:999px; background:#dcecff; direction:rtl; }
        .kanban-top-scroll-content { height:1px; }
        .kanban-board { display:flex; gap:1rem; overflow-x:auto; align-items:flex-start; padding-bottom:1rem; scrollbar-width:none; }
        .kanban-board::-webkit-scrollbar { display:none; }
        .kanban-column { min-width:290px; max-width:340px; flex:1 0 290px; background:rgba(247,251,255,.48); border:1px solid rgba(220,233,247,.82); border-radius:22px; padding:.85rem; min-height:420px; box-shadow:0 10px 26px rgba(39,91,145,.08); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
        .kanban-column.is-over { background:#e5efff; outline:2px dashed #0d6efd; }
        .kanban-column-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:.75rem; }
        .kanban-card { background:rgba(255,255,255,.62); border:1px solid rgba(220,233,247,.9); border-radius:18px; padding:.95rem; margin-bottom:.75rem; cursor:grab; box-shadow:0 6px 16px rgba(39,91,145,.08); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
        .kanban-card:active { cursor:grabbing; }
        .kanban-card.dragging { opacity:.45; }
        .kanban-card.pending-transfer { border-color:#f3bd58; background:rgba(255,251,235,.68); }
        .pending-transfer-badge { background:#f59e0b; color:#fff; }
        .kanban-card small { color:#6b7280; }
        @media (max-width: 900px) {
            .kanban-toolbar { align-items:stretch; flex-direction:column; gap:1rem; }
            .kanban-actions { width:100%; }
            .kanban-search { flex:1 1 auto; width:auto; }
        }
        @media (max-width: 520px) {
            .kanban-actions { flex-wrap:wrap; }
            .kanban-search { flex-basis:100%; }
            .kanban-action-btn { flex:1 1 auto; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary shadow">
        <div class="container-fluid"><span class="navbar-brand"><i class="fas fa-columns"></i> برد کانبان پرونده‌ها</span></div>
    </nav>
    <main class="container-fluid py-4">
        <div class="kanban-toolbar">
            <div>
                <h2 class="mb-1">برد جریان پرونده‌ها</h2>
                <p class="text-muted mb-0">کارت‌ها را بین ستون‌ها بکشید؛ انتقال نهایی با انتخاب گیرنده ثبت می‌شود.</p>
            </div>
            <div class="kanban-actions">
                <input id="kanbanSearch" class="form-control kanban-search" placeholder="جستجوی کد رهگیری یا مشتری">
                <button id="refreshKanban" class="btn btn-outline-primary kanban-refresh-btn" title="بروزرسانی" aria-label="بروزرسانی"><i class="fas fa-sync"></i></button>
                <a href="/new-order" class="btn btn-success kanban-action-btn"><i class="fas fa-plus"></i> پرونده جدید</a>
            </div>
        </div>
        <div id="kanbanTopScroll" class="kanban-top-scroll" aria-label="جابجایی بین ستون‌ها">
            <div id="kanbanTopScrollContent" class="kanban-top-scroll-content"></div>
        </div>
        <div id="kanbanBoard" class="kanban-board">
            <div class="text-center text-muted py-5 w-100"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/static/js/pages/orders.js?v=20260818-1"></script>
    <script src="/static/js/sidebar.js?v=20260819-2"></script>
</body>
</html>
