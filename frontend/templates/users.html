<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت کاربران</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .users-toolbar { display:flex; justify-content:space-between; align-items:center; gap:1rem; }
        .role-group { border-top: 4px solid var(--role-color); }
        .role-group-title { color: var(--role-color); }
        .role-dot { display:inline-block; width:.7rem; height:.7rem; border-radius:50%; background:var(--role-color); margin-left:.35rem; }
        @media (max-width: 700px) { .users-toolbar { align-items:stretch; flex-direction:column; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary shadow">
        <div class="container-fluid"><span class="navbar-brand"><i class="fas fa-users"></i> مدیریت کاربران</span></div>
    </nav>
    <main class="container-fluid py-4">
        <div class="users-toolbar mb-4">
            <div>
                <h2 class="mb-1">کاربران سامانه</h2>
                <p class="text-muted mb-0">مدیرکل و مدیریت می‌توانند کاربران و نقش‌های سازمانی را مدیریت کنند.</p>
            </div>
            <div class="d-flex gap-2">
                <button id="refreshUsersBtn" class="btn btn-outline-primary"><i class="fas fa-sync"></i> بروزرسانی</button>
                <button id="addUserBtn" class="btn btn-success"><i class="fas fa-plus"></i> کاربر جدید</button>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body" id="users-table">
                <div class="text-center text-muted py-5"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
            </div>
        </div>

    </main>
    <script src="/static/js/pages/users.js?v=20260817-3"></script>
    <script src="/static/js/sidebar.js?v=20260817-1"></script>
</body>
</html>
